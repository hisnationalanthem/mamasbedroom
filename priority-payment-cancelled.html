<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Stripe Checkout Cancelled — Mama Anthem</title>
  <style>
    :root {
      --ink:#171310;
      --cream:#f8f0e4;
      --wine:#6f2434;
      --line:rgba(89,62,46,.28);
      --display:Georgia,"Times New Roman",serif;
      --body:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      color:var(--ink);
      font-family:var(--body);
      background:linear-gradient(180deg,#f2e9da,#e6d5bb);
    }
    .card {
      width:min(720px,100%);
      padding:clamp(28px,6vw,54px);
      border:1px solid var(--line);
      border-radius:28px;
      background:rgba(248,240,228,.72);
      box-shadow:0 18px 50px rgba(18,10,8,.16);
    }
    .eyebrow {
      color:var(--wine);
      font-size:.75rem;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    h1 {
      margin:12px 0 18px;
      font:500 clamp(2.8rem,8vw,5.3rem)/.95 var(--display);
      letter-spacing:-.04em;
    }
    p { color:#51443e; line-height:1.65; }
    .button-row {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:24px;
    }
    .btn {
      display:inline-flex;
      min-height:48px;
      align-items:center;
      justify-content:center;
      padding:0 20px;
      border:1px solid var(--ink);
      border-radius:999px;
      text-decoration:none;
      font-weight:900;
      cursor:pointer;
    }
    .btn-primary {
      background:var(--wine);
      border-color:var(--wine);
      color:var(--cream);
    }
    .btn-ghost {
      background:transparent;
      color:var(--ink);
    }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">Stripe checkout cancelled</span>
    <h1>nothing was charged.</h1>

    <p>
      Your priority request is still saved as awaiting donation, but Stripe did not
      confirm a payment.
    </p>

    <p data-request-line></p>

    <div class="button-row">
      <button
        class="btn btn-primary"
        type="button"
        data-retry
        hidden
      >
        Return to Stripe checkout
      </button>

      <a class="btn btn-ghost" href="prioritize.html">
        Back to priority form
      </a>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);

    const requestId =
      params.get("request_id") ||
      sessionStorage.getItem("anthemLastPriorityRequestId");

    const checkoutUrl =
      sessionStorage.getItem("anthemPriorityCheckoutUrl");

    const requestLine =
      document.querySelector("[data-request-line]");

    if (requestId) {
      requestLine.textContent =
        `Saved request: ${requestId}`;
    }

    const retry =
      document.querySelector("[data-retry]");

    if (checkoutUrl) {
      retry.hidden = false;

      retry.addEventListener("click", () => {
        window.location.assign(checkoutUrl);
      });
    }
  </script>
</body>
</html>
